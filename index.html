    if(!el) return;
    const io = new IntersectionObserver(([entry]) => {
      if(entry.isIntersecting) el.classList.add('in');
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}
